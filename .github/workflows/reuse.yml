name: Reuse the other workflow

on:
  workflow_dispatch:

jobs:
  call-workflow-kaercher:
    uses: ./.github/workflows/reusable.yml
    with:
      who-to-greet: Kärcher!

  call-workflow-world:
    uses: ./.github/workflows/reusable.yml
    with:
      who-to-greet: world!

  call-workflow-nasmi:
    uses: ./.github/workflows/reusable.yml
    with:
      who-to-greet: Nasmi!

  use-output:
    runs-on: ubuntu-latest
    needs: [call-workflow-kaercher]
    steps:
      - run: echo "Time was ${{ needs.call-workflow.outputs.current-time }}"
    
